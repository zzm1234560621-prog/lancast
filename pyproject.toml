[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lancast"
version = "0.1.0"
description = "Low-latency, encrypted LAN screen mirroring from a Windows PC to phones and tablets, viewed in the browser"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "av>=12",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "dxcam>=0.0.5; sys_platform == 'win32'",
    "mss>=9",
    "cryptography>=42",
    "qrcode>=7.4",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6"]

[project.scripts]
lancast = "lancast.cli:main"

[tool.setuptools.packages.find]
include = ["lancast*"]

[tool.setuptools.package-data]
lancast = ["web/viewer/*", "web/admin/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "lancast"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
